    <rect width="1280" height="360" rx="34" fill="url(#g)"/>
    <rect width="1280" height="360" rx="34" fill="url(#r)"/>
    <circle cx="1120" cy="80" r="190" fill="#fff" fill-opacity=".035"/>
    <circle cx="1040" cy="310" r="150" fill="#fff" fill-opacity=".025"/>
    <g filter="url(#shadow)">
