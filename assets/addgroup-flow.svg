<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="426" viewBox="0 0 1200 426" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
    <title id="title">Add Computer to AD Group workflow</title>
    <desc id="desc">Follow steps 1 to 7: set AD variables; validate Windows and secure channel; bind with Kerberos over LDAPS; find computer and group; add if missing; verify membership; clear variables. Run in full Windows after domain join and restart. Native Task Sequence steps create and clear both hidden credential variables, including on failure.</desc>
    <style>
        svg { --canvas: #f4f8fa; --surface: #fff; --text: #243746; --muted: #526574; --accent: #117865; --on-accent: #fff; --arrow: #155799; }
        .canvas { fill: var(--canvas); }
        .card { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
        .number { fill: var(--accent); }
        .digit { fill: var(--on-accent); font-size: 20px; font-weight: 700; text-anchor: middle; }
        .label { fill: var(--text); font-size: 22px; font-weight: 600; }
        .heading { fill: var(--text); font-size: 32px; font-weight: 700; }
        .note { fill: var(--muted); font-size: 22px; }
        .connector { fill: none; stroke: var(--arrow); stroke-width: 2.5; marker-end: url(#arrow); }
        @media (prefers-color-scheme: dark) {
            svg { --canvas: #0d1520; --surface: #152333; --text: #e5edf3; --muted: #b0c3d1; --accent: #70dec5; --on-accent: #103d38; --arrow: #9dcbff; }
        }
    </style>
    <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M1 1l6 3-6 3" fill="none" stroke="var(--arrow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>
    <rect class="canvas" width="1200" height="426" rx="24"/>
    <text class="heading" x="32" y="50">Add Computer to AD Group workflow</text>
    <g class="step" transform="translate(32 88)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">1</text>
        <text class="label" x="60" y="37">Set AD</text>
        <text class="label" x="60" y="65">variables</text>
    </g>
    <path class="connector" d="M299 132h17"/>
    <g class="step" transform="translate(324 88)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">2</text>
        <text class="label" x="60" y="37">Validate Windows</text>
        <text class="label" x="60" y="65">+ secure channel</text>
    </g>
    <path class="connector" d="M591 132h17"/>
    <g class="step" transform="translate(616 88)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">3</text>
        <text class="label" x="60" y="37">Kerberos LDAPS</text>
        <text class="label" x="60" y="65">bind</text>
    </g>
    <path class="connector" d="M883 132h17"/>
    <g class="step" transform="translate(908 88)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">4</text>
        <text class="label" x="60" y="37">Find computer</text>
        <text class="label" x="60" y="65">+ group</text>
    </g>
    <path class="connector" d="M1038 183v21H892v21"/>
    <g class="step" transform="translate(762 232)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">5</text>
        <text class="label" x="60" y="51">Add if missing</text>
    </g>
    <path class="connector" d="M755 276h-17"/>
    <g class="step" transform="translate(470 232)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">6</text>
        <text class="label" x="60" y="37">Verify</text>
        <text class="label" x="60" y="65">membership</text>
    </g>
    <path class="connector" d="M463 276h-17"/>
    <g class="step" transform="translate(178 232)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">7</text>
        <text class="label" x="60" y="51">Clear variables</text>
    </g>
    <text class="note" x="32" y="364">Full Windows after domain join and restart.</text>
    <text class="note" x="32" y="398">Native Task Sequence steps clear both hidden variables on success and failure.</text>
</svg>
