<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img" aria-label="Add Computer to AD Group">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="50" font-family="Segoe UI, Arial" font-size="30" font-weight="700" fill="#0f172a">Add Computer to AD Group</text>
<rect x="70" y="90" width="1060" height="46" rx="12" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
<circle cx="102" cy="113" r="16" fill="#7C3AED"/><text x="97" y="119" font-family="Segoe UI" font-size="16" font-weight="700" fill="#ffffff">1</text>
<text x="135" y="120" font-family="Segoe UI, Arial" font-size="20" fill="#0f172a">Set AD variables</text>
<line x1="600" y1="138" x2="600" y2="158" stroke="#7C3AED" stroke-width="3"/>
<rect x="70" y="162" width="1060" height="46" rx="12" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
<circle cx="102" cy="185" r="16" fill="#7C3AED"/><text x="97" y="191" font-family="Segoe UI" font-size="16" font-weight="700" fill="#ffffff">2</text>
<text x="135" y="192" font-family="Segoe UI, Arial" font-size="20" fill="#0f172a">Validate secure channel</text>
<line x1="600" y1="210" x2="600" y2="230" stroke="#7C3AED" stroke-width="3"/>
<rect x="70" y="234" width="1060" height="46" rx="12" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
<circle cx="102" cy="257" r="16" fill="#7C3AED"/><text x="97" y="263" font-family="Segoe UI" font-size="16" font-weight="700" fill="#ffffff">3</text>
<text x="135" y="264" font-family="Segoe UI, Arial" font-size="20" fill="#0f172a">Kerberos LDAPS bind</text>
<line x1="600" y1="282" x2="600" y2="302" stroke="#7C3AED" stroke-width="3"/>
<rect x="70" y="306" width="1060" height="46" rx="12" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
<circle cx="102" cy="329" r="16" fill="#7C3AED"/><text x="97" y="335" font-family="Segoe UI" font-size="16" font-weight="700" fill="#ffffff">4</text>
<text x="135" y="336" font-family="Segoe UI, Arial" font-size="20" fill="#0f172a">Find computer and group</text>
<line x1="600" y1="354" x2="600" y2="374" stroke="#7C3AED" stroke-width="3"/>
<rect x="70" y="378" width="1060" height="46" rx="12" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
<circle cx="102" cy="401" r="16" fill="#7C3AED"/><text x="97" y="407" font-family="Segoe UI" font-size="16" font-weight="700" fill="#ffffff">5</text>
<text x="135" y="408" font-family="Segoe UI, Arial" font-size="20" fill="#0f172a">Add membership if needed</text>
<line x1="600" y1="426" x2="600" y2="446" stroke="#7C3AED" stroke-width="3"/>
<rect x="70" y="450" width="1060" height="46" rx="12" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
<circle cx="102" cy="473" r="16" fill="#7C3AED"/><text x="97" y="479" font-family="Segoe UI" font-size="16" font-weight="700" fill="#ffffff">6</text>
<text x="135" y="480" font-family="Segoe UI, Arial" font-size="20" fill="#0f172a">Verify direct membership</text>
</svg>
