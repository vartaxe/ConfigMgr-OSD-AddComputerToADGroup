<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="260" viewBox="0 0 1400 260" role="img" aria-labelledby="title desc">
<title id="title">ConfigMgr Task Sequence pattern</title>
<desc id="desc">Task Sequence pattern in full Windows after domain join and restart. Set and clear both hidden custom credential variables and preserve the result on success and failure.</desc>
<defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".15"/></filter></defs>
<rect width="1400" height="260" rx="24" fill="#f8fafc"/>
<text x="40" y="50" font-family="Segoe UI, Inter, Arial" font-size="30" font-weight="700" fill="#0f172a">ConfigMgr Task Sequence pattern</text>
<text x="40" y="225" font-family="Segoe UI, Arial" font-size="19" fill="#475569">Full Windows after domain join and restart. Preserve the result; clear both hidden variables on success and failure.</text>
<rect x="40" y="96" width="160" height="74" rx="18" fill="#fff" stroke="#7C3AED" stroke-width="3" filter="url(#shadow)"/><circle cx="65" cy="121" r="15" fill="#7C3AED"/><text x="65" y="127" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#fff">1</text><text x="120.0" y="140" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="600" fill="#0f172a">Set variables</text><path d="M204 133h16" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M217 126l8 7-8 7" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="224" y="96" width="160" height="74" rx="18" fill="#fff" stroke="#7C3AED" stroke-width="3" filter="url(#shadow)"/><circle cx="249" cy="121" r="15" fill="#7C3AED"/><text x="249" y="127" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#fff">2</text><text x="304.0" y="140" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="600" fill="#0f172a">Run packaged script</text><path d="M388 133h16" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M401 126l8 7-8 7" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="408" y="96" width="160" height="74" rx="18" fill="#fff" stroke="#7C3AED" stroke-width="3" filter="url(#shadow)"/><circle cx="433" cy="121" r="15" fill="#7C3AED"/><text x="433" y="127" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#fff">3</text><text x="488.0" y="140" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="600" fill="#0f172a">Validate result</text><path d="M572 133h16" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M585 126l8 7-8 7" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="592" y="96" width="160" height="74" rx="18" fill="#fff" stroke="#7C3AED" stroke-width="3" filter="url(#shadow)"/><circle cx="617" cy="121" r="15" fill="#7C3AED"/><text x="617" y="127" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#fff">4</text><text x="672.0" y="140" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="600" fill="#0f172a">Clear variables</text>
