<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
    <title id="title">ConfigMgr Task Sequence pattern</title>
    <desc id="desc">Set hidden custom credential variables; run the packaged script and save its result; clear both variables on success and failure; report the saved result. Run in full Windows after domain join and restart.</desc>
    <style>
        svg { --canvas: #f8fafc; --surface: #fff; --text: #0f172a; --muted: #334155; --accent: #7c3aed; --on-accent: #fff; --arrow: #2563eb; }
        .canvas { fill: var(--canvas); }
        .card { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
        .number { fill: var(--accent); }
        .digit { fill: var(--on-accent); font-size: 20px; font-weight: 700; text-anchor: middle; }
        .label { fill: var(--text); font-size: 22px; font-weight: 600; }
        .heading { fill: var(--text); font-size: 32px; font-weight: 700; }
        .note { fill: var(--muted); font-size: 22px; }
        .connector { fill: none; stroke: var(--arrow); stroke-width: 2.5; marker-end: url(#arrow); }
        @media (prefers-color-scheme: dark) {
            svg { --canvas: #0f172a; --surface: #162238; --text: #f1f5f9; --muted: #cbd5e1; --accent: #c4b5fd; --on-accent: #1e1038; --arrow: #93c5fd; }
        }
    </style>
    <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M1 1l6 3-6 3" fill="none" stroke="var(--arrow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>
    <rect class="canvas" width="1200" height="282" rx="24"/>
    <text class="heading" x="32" y="50">ConfigMgr Task Sequence pattern</text>
    <g class="step" transform="translate(32 88)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">1</text>
        <text class="label" x="60" y="51">Set variables</text>
    </g>
    <path class="connector" d="M299 132h17"/>
    <g class="step" transform="translate(324 88)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">2</text>
        <text class="label" x="60" y="37">Run script and</text>
        <text class="label" x="60" y="65">save result</text>
    </g>
    <path class="connector" d="M591 132h17"/>
    <g class="step" transform="translate(616 88)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">3</text>
        <text class="label" x="60" y="37">Clear variables</text>
        <text class="label" x="60" y="65">success / failure</text>
    </g>
    <path class="connector" d="M883 132h17"/>
    <g class="step" transform="translate(908 88)">
        <rect class="card" width="260" height="88" rx="16"/>
        <circle class="number" cx="27" cy="44" r="18"/>
        <text class="digit" x="27" y="51">4</text>
        <text class="label" x="60" y="37">Report saved</text>
        <text class="label" x="60" y="65">result</text>
    </g>
    <text class="note" x="32" y="220">Full Windows after domain join and restart.</text>
    <text class="note" x="32" y="254">Clear both hidden variables on success and failure, then report the saved result.</text>
</svg>
