<svg xmlns="http://www.w3.org/2000/svg" width="440" height="884" viewBox="0 0 440 884" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
    <title id="title">Add Computer to AD Group workflow</title>
    <desc id="desc">Follow steps 1 to 7: set AD variables; validate Windows and secure channel; bind with Kerberos over LDAPS; find computer and group; add if missing; verify membership; clear variables. Run in full Windows after domain join and restart. Native Task Sequence steps create and clear both hidden credential variables, including on failure.</desc>
    <style>
        svg { --canvas: #f8fafc; --surface: #fff; --text: #0f172a; --muted: #334155; --accent: #7c3aed; --on-accent: #fff; --arrow: #2563eb; }
        .canvas { fill: var(--canvas); }
        .card { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
        .number { fill: var(--accent); }
        .digit { fill: var(--on-accent); font-size: 20px; font-weight: 700; text-anchor: middle; }
        .label { fill: var(--text); font-size: 24px; font-weight: 600; }
        .heading { fill: var(--text); font-size: 32px; font-weight: 700; }
        .note { fill: var(--muted); font-size: 18px; }
        .connector { fill: none; stroke: var(--arrow); stroke-width: 2.5; marker-end: url(#arrow); }
        @media (prefers-color-scheme: dark) {
            svg { --canvas: #0f172a; --surface: #162238; --text: #f1f5f9; --muted: #cbd5e1; --accent: #c4b5fd; --on-accent: #1e1038; --arrow: #93c5fd; }
        }
    </style>
    <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M1 1l6 3-6 3" fill="none" stroke="var(--arrow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>
    <rect class="canvas" width="440" height="884" rx="24"/>
    <text class="heading" x="24" y="42">Add Computer to</text>
    <text class="heading" x="24" y="82">AD Group workflow</text>
    <g class="step" transform="translate(24 104)">
        <rect class="card" width="392" height="76" rx="16"/>
        <circle class="number" cx="30" cy="38" r="18"/>
        <text class="digit" x="30" y="45">1</text>
        <text class="label" x="66" y="45">Set AD variables</text>
    </g>
    <path class="connector" d="M54 185v9"/>
    <g class="step" transform="translate(24 200)">
        <rect class="card" width="392" height="76" rx="16"/>
        <circle class="number" cx="30" cy="38" r="18"/>
        <text class="digit" x="30" y="45">2</text>
        <text class="label" x="66" y="31">Validate Windows +</text>
        <text class="label" x="66" y="59">secure channel</text>
    </g>
    <path class="connector" d="M54 281v9"/>
    <g class="step" transform="translate(24 296)">
        <rect class="card" width="392" height="76" rx="16"/>
        <circle class="number" cx="30" cy="38" r="18"/>
        <text class="digit" x="30" y="45">3</text>
        <text class="label" x="66" y="45">Kerberos LDAPS bind</text>
    </g>
    <path class="connector" d="M54 377v9"/>
    <g class="step" transform="translate(24 392)">
        <rect class="card" width="392" height="76" rx="16"/>
        <circle class="number" cx="30" cy="38" r="18"/>
        <text class="digit" x="30" y="45">4</text>
        <text class="label" x="66" y="45">Find computer + group</text>
    </g>
    <path class="connector" d="M54 473v9"/>
    <g class="step" transform="translate(24 488)">
        <rect class="card" width="392" height="76" rx="16"/>
        <circle class="number" cx="30" cy="38" r="18"/>
        <text class="digit" x="30" y="45">5</text>
        <text class="label" x="66" y="45">Add if missing</text>
    </g>
    <path class="connector" d="M54 569v9"/>
    <g class="step" transform="translate(24 584)">
        <rect class="card" width="392" height="76" rx="16"/>
        <circle class="number" cx="30" cy="38" r="18"/>
        <text class="digit" x="30" y="45">6</text>
        <text class="label" x="66" y="45">Verify membership</text>
    </g>
    <path class="connector" d="M54 665v9"/>
    <g class="step" transform="translate(24 680)">
        <rect class="card" width="392" height="76" rx="16"/>
        <circle class="number" cx="30" cy="38" r="18"/>
        <text class="digit" x="30" y="45">7</text>
        <text class="label" x="66" y="45">Clear variables</text>
    </g>
    <text class="note" x="24" y="804">Full Windows after domain join</text>
    <text class="note" x="24" y="830">and restart. Native steps clear both hidden</text>
    <text class="note" x="24" y="856">variables on success and failure.</text>
</svg>
